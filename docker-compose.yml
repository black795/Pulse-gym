# OPCIONAL: PostgreSQL local con un solo comando →  docker compose up -d
# Luego en backend/.env:  DATABASE_URL=postgresql+psycopg://pulse:pulse@localhost:5432/pulse_gym
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse_gym
    ports:
      - "5432:5432"
    volumes:
      - pulse_gym_datos:/var/lib/postgresql/data

volumes:
  pulse_gym_datos:
